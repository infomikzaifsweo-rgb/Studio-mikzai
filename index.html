
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mik Zai — Photographer</title>
<meta name="description" content="Mik Zai is an independent photographer working with artists, fashion and people.">

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #fff;
  color: #171717;
  font-family: Arial, Helvetica, sans-serif;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
}

header {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  padding: 28px 4.7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 5;
}

header a {
  color: inherit;
  text-decoration: none;
  font-size: 15px;
  font-weight: 400;
}

header a:hover {
  text-decoration: underline;
  text-underline-offset: 5px;
}

.home {
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 100px 24px;
}

.slideshow {
  position: relative;
  width: min(350px, 72vw);
  height: min(440px, 57vh);
  min-height: 300px;
  cursor: pointer;
  background: #f5f5f3;
}

.slideshow img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 1.1s ease;
}

.slideshow img.active {
  opacity: 1;
}

.about {
  min-height: 100svh;
  padding: 17vh 5% 12vh;
  display: flex;
  align-items: center;
}

.about-inner {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8%;
  align-items: start;
}

.bio {
  max-width: 440px;
  font-size: clamp(24px, 3.3vw, 34px);
  line-height: 1.22;
  letter-spacing: -1.1px;
  margin: 0;
}

.contact {
  font-size: clamp(24px, 3.3vw, 34px);
  line-height: 1.22;
  letter-spacing: -1px;
}

.contact p {
  margin: 0 0 4px;
}

.contact a {
  color: inherit;
  overflow-wrap: anywhere;
  text-underline-offset: 3px;
}

footer {
  padding: 24px 5%;
  font-size: 11px;
  display: flex;
  justify-content: space-between;
  color: #777;
}

@media (max-width: 600px) {
  header {
    padding: 25px 5%;
  }

  header a {
    font-size: 14px;
  }

  .slideshow {
    width: min(350px, 72vw);
    height: min(440px, 48vh);
    min-height: 280px;
  }

  .about {
    padding: 20vh 5% 12vh;
  }

  .about-inner {
    grid-template-columns: 1fr;
    gap: 38px;
  }

  .bio, .contact {
    font-size: 27px;
    line-height: 1.25;
    letter-spacing: -0.8px;
  }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .slideshow img { transition: none; }
}
</style>
</head>

<body>

<header>
  <a href="#home">MIK ZAI</a>
  <a href="#about">ABOUT</a>
</header>

<main>
  <section class="home" id="home">
    <div class="slideshow" id="slideshow"
         role="button" tabindex="0"
         aria-label="View next photograph">

      <img class="active"
        src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1000&q=85"
        alt="Portrait photograph">

      <img
        src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=1000&q=85"
        alt="Portrait photograph">

      <img
        src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=1000&q=85"
        alt="Fashion photograph">

      <img
        src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=1000&q=85"
        alt="Editorial photograph">
    </div>
  </section>

  <section class="about" id="about">
    <div class="about-inner">

      <p class="bio">
        Mik Zai is an independent photographer based in Thailand.
        His practice explores people, identity and atmosphere
        through a personal visual perspective.
      </p>

      <div class="contact">
        <p>Contact:</p>
        <a href="mailto:your@email.com">your@email.com</a>
      </div>

    </div>
  </section>
</main>

<footer>
  <span>MIK ZAI</span>
  <span>PHOTOGRAPHY</span>
</footer>

<script>
const gallery = document.querySelectorAll(".slideshow img");
const slideshow = document.getElementById("slideshow");
let current = 0;

function nextImage() {
  gallery[current].classList.remove("active");
  current = (current + 1) % gallery.length;
  gallery[current].classList.add("active");
}

let timer = setInterval(nextImage, 4000);

slideshow.addEventListener("click", () => {
  nextImage();
  clearInterval(timer);
  timer = setInterval(nextImage, 4000);
});

slideshow.addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    nextImage();
  }
});
</script>

</body>
</html>
